<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Word Trick</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Bungee&display=swap" rel="stylesheet">
<style>
:root{--h:260;--bg:hsl(var(--h) 30% 9%);--panel:hsl(var(--h) 26% 15%);--ink:hsl(var(--h) 60% 95%);--muted:hsl(var(--h) 20% 68%);--pur:hsl(var(--h) 70% 68%);--g:#22c55e;--y:#eab308;--x:hsl(var(--h) 14% 42%);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Outfit",system-ui,sans-serif;font-size:18px;display:flex;justify-content:center}
main{width:100%;max-width:480px;padding:24px 16px 40px;text-align:center}
h1{margin:0 0 8px;font-family:"Bungee","Outfit",system-ui,sans-serif;font-weight:400;font-size:clamp(30px,9.5vw,44px);letter-spacing:1px;line-height:1.1}
.sub{margin:0 0 12px;color:var(--muted);font-size:17px}
.lg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;font-size:14.5px;margin:0 0 10px;text-align:center;color:var(--muted);background:var(--panel);padding:10px;border-radius:12px;line-height:1.3}
.lg span{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:8px}
.lg div{border-top:4px solid;padding-top:6px}
.lg b{display:block;color:var(--ink);font-size:16px}
button{font:inherit;font-weight:600;cursor:pointer}
#msg{min-height:26px;font-weight:600;margin:6px 0 10px}
#grid{display:flex;flex-direction:column;gap:5px;align-items:center;margin:0 auto 12px}
.row{display:flex;gap:5px;justify-content:center}
.t{--s:min(var(--cap,44px),calc((100vw - 48px - (var(--n) - 1) * 5px) / var(--n)));width:var(--s);height:var(--s);border:2px solid var(--muted);display:flex;align-items:center;justify-content:center;font-size:calc(var(--s) * .5);font-weight:700;text-transform:uppercase;color:var(--ink);background:var(--panel);padding:0;border-radius:8px}
.t.g{background:var(--g);border-color:var(--g);color:#052e16}
.t.y{background:var(--y);border-color:var(--y);color:#2a1f00}
.t.x{background:var(--x);border-color:var(--x);color:#fff}
.t.sus{outline:3px dashed #ef4444;outline-offset:-5px}
.hid{position:absolute;width:1px;height:1px;padding:0;margin:0;border:0;opacity:0;pointer-events:none}
.t.cur{border-color:var(--pur)}
.nm{font-size:16px;letter-spacing:0;text-transform:none;width:200px;padding:8px 10px;margin:0 0 10px;border:2px solid var(--muted)}
.pop{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.pop[hidden]{display:none}
.card{background:var(--panel);border:2px solid var(--pur);border-radius:16px;padding:24px 28px;text-align:center;max-width:340px;width:100%}
#pwho{font-size:20px;font-weight:700}
#pword{font-size:34px;font-weight:700;letter-spacing:4px;color:var(--pur);margin:8px 0 16px;text-transform:uppercase;word-break:break-all}
#pnew{padding:10px 22px;border-radius:8px;border:0;background:var(--pur);color:#1a1033}
input{font:inherit;font-size:22px;letter-spacing:3px;text-transform:uppercase;width:170px;padding:10px;border-radius:8px;border:2px solid var(--pur);background:transparent;color:var(--ink);text-align:center}
#go{padding:10px 18px;border-radius:8px;border:0;background:var(--pur);color:#1a1033}
input:disabled,#go:disabled{opacity:.4}
input:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
#ab{display:grid;grid-template-columns:repeat(13,1fr);gap:4px;margin:0 0 10px}
#ab button{width:100%;height:36px;border-radius:8px;border:0;background:var(--panel);color:var(--ink);padding:0;text-transform:uppercase}
#ab button.used{background:hsl(var(--h) 20% 42%)}
#ab button.on{background:var(--pur);color:#1a1033}
#ab button.off{opacity:.3;text-decoration:line-through}
.len{display:flex;gap:6px;justify-content:center;align-items:center;flex-wrap:wrap;margin:0 0 12px;color:var(--muted);font-size:14px}
.len button{padding:6px 10px;border-radius:8px;border:2px solid var(--muted);background:transparent;color:var(--ink)}
.len button.sel{background:var(--pur);color:#1a1033;border-color:var(--pur)}
.acts{display:flex;gap:10px;justify-content:center}
.acts button{padding:10px 18px;border-radius:8px;background:transparent;color:var(--ink);border:2px solid var(--muted)}
.acts button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}
@media (min-width:800px){
:root{--cap:70px}
body{font-size:26px}
main{max-width:820px;padding-top:32px}
h1{font-size:66px;margin-bottom:12px}
.sub{font-size:24px}
.lg{font-size:20px;padding:14px;gap:14px}
.lg b{font-size:23px}
#msg{min-height:40px}
#grid,.row{gap:8px}
#ab{gap:6px}
#ab button{height:54px}
.acts button{padding:14px 30px}
.card{max-width:480px;padding:32px 36px}
#pwho{font-size:28px}
#pword{font-size:54px}
#pnew{padding:14px 32px;font-size:22px}
}
</style></head><body>
<main>
<h1>Word Trick</h1>
<p class="sub">Guess the secret word. The colors do not mean what they do in Wordle!</p>
<div class="lg"><div style="border-color:var(--g)"><b>Green</b>wrong spot, or not in the word</div><div style="border-color:var(--y)"><b>Yellow</b>right spot, or not in the word</div><div style="border-color:var(--x)"><b>Gray</b>in the word, any spot</div></div>
<div id="ab" aria-label="Alphabet notes"></div>
<div id="msg" role="status"></div>
<div id="grid"></div>
<input id="g" class="hid" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" enterkeyhint="go" aria-label="Type your guess">
<div class="acts"><button id="nb">New game</button><button id="give">Give up</button></div>
</main>
<div id="pop" class="pop" hidden role="dialog" aria-modal="true"><div class="card"><div style="font-size:42px">🎉</div><div id="pwho"></div><div id="pword"></div><button id="pnew">New game</button></div></div>

const OK=new Set(Object.values(V).flatMap(s=>s.split(' ')));Object.values(L).forEach(s=>s.split(' ').forEach(w=>OK.add(w)));
let secret,n,rows,cur,over,marks,want=0,winner='';
function grade(g,s){const r=Array(n).fill('x'),u=s.split('');
 for(let i=0;i<n;i++)if(g[i]===s[i]){r[i]='g';u[i]=null}
 for(let i=0;i<n;i++)if(r[i]==='x'){const j=u.indexOf(g[i]);if(j>-1){r[i]='y';u[j]=null}}
 return r}
function show(t,g){const p=()=>Math.random()<.5;return t.map((c,i)=>c==='g'?(p()?'y':'x'):c==='y'?(p()?'g':'x'):(p()?'y':'g'))}
function start(){n=want||3+Math.floor(Math.random()*5);const a=L[n].split(" ");secret=a[Math.floor(Math.random()*a.length)];
 rows=[];cur="";over=false;marks={};winner='';document.getElementById('pop').hidden=true;const g0=document.getElementById('g');g0.value="";g0.maxLength=n;g0.disabled=false;g0.focus({preventScroll:true});ab();document.getElementById('give').disabled=false;
 msg("A "+n+"-letter word. Type your guess, then press Enter.");draw()}
function msg(t){document.getElementById('msg').textContent=t}
function draw(){const g=document.getElementById('grid');g.innerHTML="";
 const total=rows.length+(over?0:1);
 for(let r=0;r<total;r++){const row=document.createElement('div');row.className='row';
  for(let c=0;c<n;c++){const b=document.createElement('button');b.className='t';b.style.setProperty('--n',n);
   if(r<rows.length){b.classList.add(rows[r].s[c]);b.textContent=rows[r].w[c];
    if(marks[r+'-'+c])b.classList.add('sus');
    b.onclick=()=>{marks[r+'-'+c]=!marks[r+'-'+c];draw()}}
   else{b.tabIndex=-1;b.setAttribute('aria-hidden','true');b.onclick=()=>gi.focus();if(c===Math.min(cur.length,n-1))b.classList.add('cur');b.textContent=cur[c]||""}
   row.appendChild(b)}
  g.appendChild(row)}
 g.lastChild&&g.lastChild.scrollIntoView({block:"nearest"})}
function fits(w){for(const r of rows)for(let i=0;i<n;i++){const c=r.s[i],L=r.w[i],U=L.toUpperCase();
 if(c==='y'&&w[i]!==L&&[...w].filter(x=>x===L).length>=[...r.w].filter(x=>x===L).length)return "yellow "+U+" in spot "+(i+1)+".";
 if(c==='g'&&w[i]===L)return "green "+U+" in spot "+(i+1)+".";
 if(c==='x'&&!w.includes(L))return "gray "+U+" must be in the word."}return ""}
function submit(){if(over)return;if(cur.length<n){msg("Need "+n+" letters.");return}
 if(!OK.has(cur)){msg(cur.toUpperCase()+" is not a valid word.");return}
 const why=fits(cur);if(why){msg(cur.toUpperCase()+" does not fit the tiles.");return}
 rows.push({w:cur,s:show(grade(cur,secret),cur)});used();
 if(cur===secret){over=true;document.getElementById('give').disabled=true;document.getElementById('g').disabled=true;msg("");popup();confetti()}
 else msg("");document.getElementById('g').value="";
 cur="";draw()}
function key(k){if(over)return;if(k==="Enter")submit();
 else if(k==="Backspace"){cur=cur.slice(0,-1);draw()}
 else if(/^[a-z]$/i.test(k)&&cur.length<n){cur+=k.toLowerCase();draw()}}
const gi=document.getElementById('g');
gi.addEventListener('input',()=>{if(over)return;gi.value=gi.value.replace(/[^a-z]/gi,'').toLowerCase();cur=gi.value;draw()});
gi.addEventListener('keydown',e=>{if(e.key==='Enter')submit()});
document.getElementById('grid').addEventListener('click',()=>{if(!over)gi.focus()});
document.addEventListener('keydown',e=>{if(!over&&document.activeElement.tagName!=='INPUT'&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&(e.key.length===1||e.key==='Enter'||e.key==='Backspace'))gi.focus()});
function used(){const u=new Set(rows.flatMap(r=>r.w.split('')));document.querySelectorAll('#ab button').forEach(b=>b.classList.toggle('used',u.has(b.textContent)))}
function ab(){const a=document.getElementById('ab');a.innerHTML="";for(const ch of "abcdefghijklmnopqrstuvwxyz"){const b=document.createElement('button');b.textContent=ch;let s=0;b.onclick=()=>{s=(s+1)%3;b.classList.remove('on','off');if(s===1)b.classList.add('on');if(s===2)b.classList.add('off')};a.appendChild(b)}}
document.getElementById('pnew').onclick=start;
function popup(){let nm=winner;try{nm=nm||(new URLSearchParams(location.search).get('name')||window.playerName||'').trim().slice(0,30)}catch(e){}document.getElementById('pwho').textContent=nm?nm+' got the right answer!':'Right answer!';document.getElementById('pword').textContent=secret;document.getElementById('pop').hidden=false;document.getElementById('pnew').focus();if(LIVE){const r=rows;setTimeout(()=>{if(over&&rows===r)start()},8000)}}
function remote(word,name){if(over)return;word=String(word||'').trim().toLowerCase();if(!/^[a-z]+$/.test(word)||word.length!==n)return;cur=word;winner=String(name||'').trim().slice(0,30);submit();winner=''}
window.submitGuess=remote;
window.addEventListener('message',e=>{const d=e.data;if(d&&d.type==='guess')remote(d.word,d.name)});
const LIVE=/[?&]live=1/.test(location.search)||location.protocol==='file:';
function tikfinity(){let ws;try{ws=new WebSocket('ws://127.0.0.1:21213/')}catch(e){return}
 ws.onmessage=ev=>{try{const m=JSON.parse(ev.data),d=m.data||m;if(!/chat|comment/i.test(String(m.event||m.type||'')))return;const u=d.user||{};remote(d.comment||d.text||d.message,d.nickname||d.uniqueId||u.nickname||u.uniqueId)}catch(e){}};
 ws.onclose=()=>setTimeout(tikfinity,3000);ws.onerror=()=>ws.close()}
if(LIVE)tikfinity();
document.getElementById('nb').onclick=start;
document.getElementById('give').onclick=()=>{if(over)return;over=true;document.getElementById('give').disabled=true;document.getElementById('g').disabled=true;cur="";msg("You gave up. The word was "+secret.toUpperCase()+".");draw()};
function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const c=document.createElement("canvas");c.id="confetti";c.width=innerWidth;c.height=innerHeight;document.body.append(c);
  const x=c.getContext("2d"),cols=[0,45,150,200,260,320].map(h=>`hsl(${h} 85% 55%)`);
  const ps=Array.from({length:150},()=>({x:innerWidth/2+(Math.random()-.5)*160,y:innerHeight*.35,vx:(Math.random()-.5)*15,vy:-Math.random()*13-4,s:6+Math.random()*6,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[Math.floor(Math.random()*cols.length)]}));
  let t=0;
  (function f(){
    x.clearRect(0,0,c.width,c.height);t++;
    ps.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore()});
    if(t<160)requestAnimationFrame(f);else c.remove();
  })();
}
start();
